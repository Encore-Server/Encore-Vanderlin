author: "Minomato"
delete-after: True
changes:
  - rscadd: "Tieflings now have Darkvision & Heat Resistance traits."
  - rscadd: "Rakshari now have Minor Fall Damage Immunity trait."
  - balance: "Knoblits & Hobknoblits now gain 100 (up from 10) nutrition from eating items associated with their special diet."
  - balance: "Knobit stats are now: +3 Fortune, +2 Speed, +1 Endurance; -2 Strength, -2 Constitution (speed was always supposed to be +2 but description was wrong)"
  - balance: "Tiefling stats are now: +1 Perception, +1 Intelligence, +1 Speed; -2 Fortune"
  - balance: "Rakshari stats are now: +2 Perception, +2 Speed; -1 Strength, -1 Constitution, -1 Endurance."
  - bugfix: "Lupians no longer missing Scent-Sense ability."
  - bugfix: "Rakshari claws now do normal damage, reduced parry ability to normal, no longer inflict self-damage with durability loss."
  - bugfix: "Tieflings missing their mundane ignition protection trait in description."