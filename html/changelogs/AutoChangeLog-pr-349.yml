author: "furrycactus"
delete-after: True
changes:
  - map: "Adds some Valdala effigies to the Crypt."
  - map: "Adds some gravemarker, headstone, and coffin sanctification supplies to the Gravetender quarters."
  - map: "Adds some Gravetender Hats to their quarters."
  - map: "Adds an extra travel portal to and from town - one to the main gate and one by the residential borough."
  - map: "Adds a little graveyard in the cave behind the Bog Witch hut with some T1-T2 Great Hunt blessed graves - dead witches, friends, apprentices - make it up in your RP."
  - map: "Adds some T1-T3 Angrosian blessed graves to the upper part of Wey Whisperen, hinting at why that one area has resisted the area's surrounding corruption and undeath otherwise."
  - map: "Fixes the Inquisition enclave that had the blacksmith basement unceremoniously dropped in the middle of it."
  - map: "Adds a small alchemy lab to the Church basement, since Erdl and Valdala acolytes are also accomplished alchemists (but have no access to the Apothecarium at the university and thus are effectively barred from the system)."
  - map: "Adds a bag of shitty and worse surgical tools to the Church infirmary, so Acolytes (particularly Erdites) can also chop people up."
  - map: "Adds an Erdl psycross to the Clinic."
  - rscadd: "Adds a new church sub-area called the Graveyard, and puts it all over the graveyard."
  - code_imp: "Removes Valdala from the Acolyte patron list. Play Gravetender, because they're literally the exact same thing in terms of skills, spells, and gear. (They're better actually, this was how Vanderlin handled it)."
  - code_imp: "Makes the Gravetender race restrictions match the Acolyte and Templar race restrictions."
  - bugfix: "Fixes the missing satchel for Acolytes."